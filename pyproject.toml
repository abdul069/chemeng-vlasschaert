[project]
name = "chemeng-vlasschaert"
version = "0.1.0"
description = "Computational chemical engineering — geverifieerde Python-herbouw van het archief van P. Vlasschaert (TrueBasic/Maxima, 2015-2024)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "sympy", "matplotlib"]
license = { file = "LICENSE" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chemeng"]
